project:
  name: swarmforge
  description: 'SwarmForge Foundation: control plane + first agent on real Zerops infra'

services:
  - hostname: postgres
    type: postgresql:single@16
    mode: NON_HA

  - hostname: valkey
    type: valkey:single@7.2
    mode: NON_HA

  - hostname: nats
    type: nats:single@2.12
    mode: NON_HA

  - hostname: control-plane
    type: ubuntu/nodejs@22
    enableSubdomainAccess: true

  - hostname: agent-architect
    type: ubuntu/nodejs@22
