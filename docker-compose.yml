services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: swarmforge
      POSTGRES_PASSWORD: swarmforge
      POSTGRES_DB: swarmforge
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U swarmforge']
      interval: 2s
      timeout: 2s
      retries: 15

  valkey:
    image: valkey/valkey:7.2
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'valkey-cli', 'ping']
      interval: 2s
      timeout: 2s
      retries: 15

  nats:
    image: nats:2.10-alpine
    command: ['-js', '-m', '8222']
    ports:
      - '4222:4222'
      - '8222:8222'
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:8222/varz']
      interval: 2s
      timeout: 2s
      retries: 15
