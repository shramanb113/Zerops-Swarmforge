zerops:
  - setup: control-plane
    build:
      base: nodejs@22
      buildCommands:
        - corepack enable
        - pnpm install --frozen-lockfile
        - pnpm --filter @swarmforge/agent-framework build
        - pnpm --filter control-plane build
      deployFiles:
        - packages/agent-framework/dist/~
        - packages/agent-framework/package.json
        - services/control-plane/dist/~
        - services/control-plane/package.json
        - services/control-plane/drizzle/~
        - node_modules/~
    run:
      base: nodejs@22
      start: node services/control-plane/dist/index.js
      ports:
        - port: 3000
          httpSupport: true
      envVariables:
        DATABASE_URL: '${postgres_connectionString}'
        NATS_URL: '${nats_connectionString}'
        VALKEY_URL: '${valkey_connectionString}'

  - setup: agent-architect
    build:
      base: nodejs@22
      buildCommands:
        - corepack enable
        - pnpm install --frozen-lockfile
        - pnpm --filter @swarmforge/agent-framework build
        - pnpm --filter agent-architect build
      deployFiles:
        - packages/agent-framework/dist/~
        - packages/agent-framework/package.json
        - services/agent-architect/dist/~
        - services/agent-architect/package.json
        - node_modules/~
    run:
      base: nodejs@22
      start: node services/agent-architect/dist/index.js
      envVariables:
        DATABASE_URL: '${postgres_connectionString}'
        NATS_URL: '${nats_connectionString}'
        VALKEY_URL: '${valkey_connectionString}'
